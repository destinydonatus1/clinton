<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D25C" />
      <stop offset="50%" stop-color="#E8B91B" />
      <stop offset="100%" stop-color="#B8890B" />
    </linearGradient>
  </defs>
  <!-- Outer Diamond Border -->
  <rect x="15" y="15" width="70" height="70" rx="4" transform="rotate(45 50 50)" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  <rect x="22" y="22" width="56" height="56" rx="2" transform="rotate(45 50 50)" fill="none" stroke="rgba(232, 185, 27, 0.4)" stroke-dasharray="2,2" stroke-width="1" />
  <!-- Monogram Letters CR -->
  <text x="50" y="58" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">CR</text>
  <!-- Small Star at Top and Bottom -->
  <polygon points="50,6 52,11 57,11 53,14 55,19 50,16 45,19 47,14 43,11 48,11" fill="url(#goldGrad)" />
  <polygon points="50,81 52,86 57,86 53,89 55,94 50,91 45,94 47,89 43,86 48,86" fill="url(#goldGrad)" />
</svg>
